<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Section Overlap Animation</title>
  <link rel="stylesheet" href="./index.css">
</head>

<body> <!-- ========================================= HERO ========================================== -->
  <section class="hero section">
    <div class="container"> <span class="eyebrow"> HERO </span>
      <h1> Build the future. </h1>
      <p> Scroll down to experience the section transition. </p>
    </div>
  </section> <!-- ========================================= SECTION 02 ========================================== -->
  <section class="content-section section section-02">
    <div class="container"> <span class="eyebrow"> SECTION 01 </span>
      <h2> The future starts here. </h2>
      <p> This entire section comes upward and overlaps the hero section. </p>
    </div>
  </section> <!-- ========================================= SECTION 03 ========================================== -->
  <section class="content-section section section-03">
    <div class="container"> <span class="eyebrow"> SECTION 02 </span>
      <h2> Designed for what's next. </h2>
      <p> This section does exactly the same thing when you continue scrolling. </p>
    </div>
  </section>
  <script src="./script.js"></script>
</body>

</html>
