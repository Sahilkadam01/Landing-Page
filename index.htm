<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Full Section Slide</title>

  <link
    rel="stylesheet"
    href="./index.css"
  >

</head>

<body>


  <!-- =====================================================
       HERO
  ====================================================== -->

  <section class="hero">

    <div class="hero-content">

      <h1>
        Build the future.
      </h1>

    </div>

  </section>


  <!-- =====================================================
       SECTION 01
  ====================================================== -->

  <section class="page-section section-one">

    <div class="section-inner">

      <div class="section-grid">

        <div class="section-content">

          <h2>
            The future
            starts here.
          </h2>

          <p>
            This is the first normal section.
          </p>

        </div>

        <div class="section-image">

          <img
            src="./assets/image-01.jpg"
            alt=""
          >

        </div>

      </div>

    </div>

  </section>


  <!-- =====================================================
       SECTION 02
  ====================================================== -->

  <section class="page-section section-two">

    <div class="section-inner">

      <div class="section-grid">

        <div class="section-image">

          <img
            src="./assets/image-02.jpg"
            alt=""
          >

        </div>

        <div class="section-content">

          <h2>
            Designed for
            what's next.
          </h2>

          <p>
            This entire section slides upward.
          </p>

        </div>

      </div>

    </div>

  </section>


  <!-- =====================================================
       SECTION 03
  ====================================================== -->

  <section class="page-section section-three">

    <div class="section-inner">

      <div class="section-grid">

        <div class="section-content">

          <h2>
            Everything
            works together.
          </h2>

          <p>
            This section also slides completely upward.
          </p>

        </div>

        <div class="section-image">

          <img
            src="./assets/image-03.jpg"
            alt=""
          >

        </div>

      </div>

    </div>

  </section>


  <!-- =====================================================
       SECTION 04
  ====================================================== -->

  <section class="page-section section-four">

    <div class="section-inner">

      <div class="section-grid">

        <div class="section-image">

          <img
            src="./assets/image-04.jpg"
            alt=""
          >

        </div>

        <div class="section-content">

          <h2>
            Made for
            tomorrow.
          </h2>

          <p>
            And this one does the same.
          </p>

        </div>

      </div>

    </div>

  </section>


  <script src="./index.js"></script>

</body>

</html>
